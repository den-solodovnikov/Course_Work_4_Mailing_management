<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Сервис управления рассылками</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="/mailings/">Главная</a>
            <a class="p-2 btn btn-outline-primary" href="/mailings/recipients/">Клиенты</a>
            <a class="p-2 btn btn-outline-primary" href="/mailings/messages/">Сообщения</a>
            <a class="p-2 btn btn-outline-primary" href="/mailings/mailings/">Рассылки</a>
            {% if user.is_authenticated %}
            <p>Добро пожаловать, {{ user.first_name }}!</p>
            <form action="{% url 'users:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
            {% else %}
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                <p>Добро пожаловать Гость! </p>
            {% endif %}

        </nav>
    </div>
</header>
