{% extends 'mailings/base.html' %}

{% block title %}Сервис управления рассылками{% endblock %}

{% block content %}

{% include 'mailings/title.html' %}

<div class="container">
    <div class="row text-center">
        <a class="p-2 btn btn-outline-primary" href="">Удаление сообщения</a>
        <h1>Удалить сообщение?</h1>
        <p>Вы уверены, что хотите удалить сообщение? <strong>{{ object.full_name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" style="color: red;">Да, удалить</button>
            <a href="{% url 'mailings:messages' %}">Отмена</a>
        </form>

    </div>
</div>

{% endblock %}
